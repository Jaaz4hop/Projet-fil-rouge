<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./../css/profil.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="./../js/main.js" defer></script>
    <title>RugbyMeet - Ton profil</title>
</head>
<body>
    <header>
        <a href="./../../index.html" id="logo"><img src="./../img/Logo Rugby Meet.png" alt="Logo de RugbyMeet"></a>
        <button id="burger" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="nav1">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav aria-label="Navigation Principale" id="nav1">
            <a href="./../../index.html">ACCUEIL</a>
            <a href="calendar.html">CALENDRIER</a>
            <a href="bar.html">BAR</a>
            <a href="about-us.html">A PROPOS</a>
            <a href="profil.html" id="nav-profil-mobile">PROFIL</a>
        </nav>
        <input type="search" id="searchBar" name="q" placeholder="🔍Recherches">
        <a href="profil.html"><button id="profil">PROFIL</button></a>
    </header>
    
    <main>
        <div id="titles">
            <h1>TON PROFIL</h1>
        </div>
        <section id="personal-info">
            <fieldset>
                <h2>Tes infos</h2>
                <div>
                    <label for="name">Nom du profil :</label>
                    <input type="text" id="name" placeholder=".......................">
                </div>
                <div>
                    <label for="mail">Mail :</label>
                    <input type="email" id="mail" placeholder="........................">
                </div>
                <div>
                    <label for="mdp">Mot de passe :</label>
                    <input type="password" id="mdp" placeholder="*********************">
                </div>
                <div>
                    <label for="city">Ta ville :</label>
                    <input type="text" id="city" placeholder=".............">
                </div>
                <p>Ton club :</p>
                <input type="button" value="Modifier">
            </fieldset>
        </section>
        <section id="club-selector">
            <fieldset>
                <p>Choisis ton club favori pour adopter ses couleurs !</p>
                <div id="container">
                    <div class="club-toggle-switch">
                        <img src="./../img/Logos/Logo-SR.png" alt="Logo La Rochelle">
                        <label for=""></label>
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="./../img/Logos/Logo-ST.png" alt="Logo Stade Toulousain">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="./../img/Logos/Logo-SP.png" alt="Logo Section Paloise">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="./../img/Logos/Logo-LOU.webp" alt="Logo LOU">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="./../img/Logos/Logo-CO.webp" alt="Logo Castres Olympique">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="./../img/Logos/Logo-UBB.png" alt="Logo Union Bordeaux-Begles">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="./../img/Logos/Logo-ASM.png" alt="Logo Clermont">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="./../img/Logos/Logo-MHR.png" alt="Logo Montpellier">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="./../img/Logos/Logo-USAP.png" alt="Logo Perpignan">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="./../img/Logos/Logo-R92.png" alt="Logo Racing">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="./../img/Logos/Logo-RCT.png" alt="Logo RCT">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="./../img/Logos/Logo-SF.png" alt="Logo Stade Français">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="./../img/Logos/Logo-AB.svg" alt="Logo Aviron Bayonnais">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="./../img/Logos/Logo-RCV.svg" alt="Logo RC Vannes">
                        <input type="checkbox">
                    </div>
                </div>
            </fieldset>
        </section>
    <footer>
        <div id="RS">
            <h4>RESEAUX SOCIAUX :</h4>
            <a href="#"><i class="bi bi-instagram"></i></a>
            <a href="#"><i class="bi bi-reddit"></i></a>
            <a href="#"><i class="bi bi-facebook"></i></a>
        </div>
        <div id="footer-logo"><img src="./../img/Logo Rugby Meet.png" alt="Logo de RugbyMeet"></div>
        <nav aria-label="navigation secondaire" id="nav2">
            <a href="contact.html">Contact</a>
            <a href="mentions-légales.html">Mentions légales</a>
        </nav>
        <div class="lang-flags">🇫🇷 🇬🇧 🇪🇸 🇮🇹</div>
    </footer>
</body>
</html>
