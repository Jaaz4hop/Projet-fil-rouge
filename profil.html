<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="profil.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="main.js" defer></script>
    <title>RugbyMeet - Accueil</title>
</head>
<body>
    <header>
        <a href="#" id="logo"><img src="Images/Logo Rugby Meet.png" alt="Logo de RugbyMeet"></a>
        <nav aria-label="Navigation Principale" id="nav1">
            <a href="Index.html">ACCUEIL</a>
            <a href="Calendar.html">CALENDRIER</a>
            <a href="Bar.html">BAR</a>
            <a href="About-us.html">A PROPOS</a>
        </nav>
        <input type="search" id="searchBar" name="q" placeholder="🔍Recherches">
        <a href="profil.html"><button id="profil">PROFIL</button></a>
    </header>
    
    <main>
        <section id="banner">
            <img src="Images/fan-zone-sport_1.png" alt="Home-banner of Rugby Meet">
        </section>
        <div id="titles">
            <h1>TON PROFIL</h1>
        </div>
        <section id="personal-info">
            <fieldset>
                <h2>Tes infos</h2>
                <div>
                    <label for="name">Nom du profil :</label>
                    <input type="text" id="name" placeholder=".......................">
                </div>
                <div>
                    <label for="mail">Mail :</label>
                    <input type="email" id="mail" placeholder="........................">
                </div>
                <div>
                    <label for="mdp">Mot de passe :</label>
                    <input type="password" id="mdp" placeholder="*********************">
                </div>
                <div>
                    <label for="city">Ta ville :</label>
                    <input type="text" id="city" placeholder=".............">
                </div>
                <p>Ton club :</p>
                <input type="button" value="Modifier">
            </fieldset>
        </section>
        <section id="club-selector">
            <fieldset>
                <p>Choisis ton club favori pour adopter ses couleurs !</p>
                <div id="container">
                    <div class="club-toggle-switch">
                        <img src="Images/Logos/Logo La rochelle.png" alt="Logo La Rochelle">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="Images/Logos/Logo_Stade_Toulousain.png" alt="Logo Stade Toulousain">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="Images/Logos/Logo Section.png" alt="Logo Section Paloise">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="Images/Logos/logo_LOU.webp" alt="Logo LOU">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="Images/Logos/logo CO.webp" alt="Logo Castres Olympique">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="Images/Logos/logo_UBB transparent.png" alt="Logo Union Bordeaux-Begles">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="Images/Logos/Logo ASM.png" alt="Logo Clermont">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="Images/Logos/Logo Montpellier.png" alt="Logo Montpellier">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="Images/Logos/Logo Perpignan.png" alt="Logo Perpignan">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="Images/Logos/Logo Racing.png" alt="Logo Racing">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="Images/Logos/Logo RCT.png" alt="Logo RCT">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="Images/Logos/Logo SF.png" alt="Logo Stade Français">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="Images/Logos/Logo_Aviron_Bayonnais_Rugby_-_2022.svg" alt="Logo Aviron Bayonnais">
                        <input type="checkbox">
                    </div>
                    <div class="club-toggle-switch">
                        <img src="Images/Logos/Logo_RC_Vannes_-_2022.svg" alt="Logo RC Vannes">
                        <input type="checkbox">
                    </div>
                </div>
            </fieldset>
        </section>
    <footer>
        <div id="RS">
            <h4>RESEAUX SOCIAUX :</h4>
            <a href="#"><i class="bi bi-instagram"></i></a>
            <a href="#"><i class="bi bi-reddit"></i></a>
            <a href="#"><i class="bi bi-facebook"></i></a>
        </div>
        <div id="footer-logo"><img src="Images/Logo Rugby Meet.png" alt="Logo de RugbyMeet"></div>
        <nav aria-label="navigation secondaire" id="nav2">
            <a href="Contact.html">Contact</a>
            <a href="Mentions-légales.html">Mentions légales</a>
        </nav>
        <div class="lang-flags">🇫🇷 🇬🇧 🇪🇸 🇮🇹</div>
    </footer>
</body>
</html>
